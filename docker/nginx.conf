# nginx for the read-only demo.
#
# Runs unprivileged: no `user` directive (the entrypoint has already dropped to
# the demo account), a high port, and every path nginx wants to write to moved
# into /tmp so the container's root filesystem can be mounted read-only.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout combined;

    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 20;
    server_tokens off;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Only Traefik can reach this container, and it arrives from the Docker
    # bridge, so those ranges are the ones allowed to say who the client is.
    # Trusting the header from anywhere would let a visitor pick their own
    # rate-limit bucket by sending an X-Forwarded-For of their choosing.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Rate limiting lives here rather than in the application. Laravel's
    # throttle middleware counts in the cache, and every cache store that
    # survives between requests needs somewhere to write - which is exactly what
    # this container does not have. nginx keeps its counters in shared memory.
    limit_req_zone $binary_remote_addr zone=demo:1m rate=120r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=democonn:1m;

    server {
        listen 8080;
        server_name _;
        root /app/public;
        index index.php;

        charset utf-8;

        limit_conn democonn 12;

        # Static assets never reach PHP, so the application's route allow-list
        # is not what serves them and they are not rate limited.
        location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Robots-Tag "noindex, nofollow" always;
            access_log off;
            try_files $uri =404;
        }

        location = /robots.txt {
            access_log off;
            try_files $uri =404;
        }

        location / {
            limit_req zone=demo burst=30 nodelay;
            try_files $uri /index.php?$query_string;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass unix:/tmp/php-fpm.sock;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 20s;
            internal;
        }

        # Anything else that looks like PHP is not ours.
        location ~ \.php$ {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }
}
