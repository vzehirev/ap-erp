; php-fpm for the read-only demo.
;
; The pool has no user/group directive: the entrypoint drops privileges before
; starting anything, so the master is already running as the demo account and
; php-fpm would only warn that it cannot change user.

[global]
error_log = /dev/stderr
daemonize = no

[www]
listen = /tmp/php-fpm.sock
listen.mode = 0660

; A demo that serves a page in a few milliseconds does not need a standing pool.
; ondemand keeps nothing resident until the first request and lets the workers
; go away again, which is what keeps the idle footprint small.
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 20s
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no

; Docker and Coolify both pass configuration in the environment, and php-fpm
; clears it from workers by default - which would leave every env() call empty.
clear_env = no
