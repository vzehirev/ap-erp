; Nothing in this container is ever edited at runtime, so opcache can be told to
; stop checking and to hold the whole application in memory permanently.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 48
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 6000

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

memory_limit = 96M
max_execution_time = 20
post_max_size = 64K
upload_max_filesize = 0
file_uploads = Off

date.timezone = Europe/Sofia
